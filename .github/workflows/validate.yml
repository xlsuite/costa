name: Validate COSTA schemas and examples
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
        working-directory: tools
      - run: npm test
        working-directory: tools
